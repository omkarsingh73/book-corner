      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingRateCalculationRequest'
      responses:
        '200':
          description: Carrier rate options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingRateOptionDto'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'

  /shipping/consignments/{trackingNumber}:
    get:
      tags:
        - Shipping
      summary: Track carrier consignment milestones
      operationId: trackConsignment
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consignment tracking timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignmentTrackingResponse'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # REVIEWS APIS
  # ============================================================================
  /books/{bookId}/reviews:
    get:
      tags:
        - Reviews
      summary: List customer book reviews
      operationId: listBookReviews
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [HELPFUL, RECENT, RATING_HIGH, RATING_LOW]
            default: HELPFUL
      responses:
        '200':
          description: Book review listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookReviewsResponse'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - Reviews
      summary: Submit a verified review and rating
      operationId: submitBookReview
      security:
        - BearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          description: Review accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /reviews/{reviewId}/votes:
    post:
      tags:
        - Reviews
      summary: Vote on review helpfulness
      operationId: voteReviewHelpful
      security:
        - BearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteReviewRequest'
      responses:
        '200':
          description: Vote recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteReviewResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # RECOMMENDATIONS APIS
  # ============================================================================
  /recommendations/home:
    get:
      tags:
        - Recommendations
      summary: Get personalized home carousel
      operationId: getHomeRecommendations
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreCodeHeader'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 30
      responses:
        '200':
          description: Recommendations computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRecommendationsResponse'

  /recommendations/books/{bookId}/upsell:
    get:
      tags:
        - Recommendations
      summary: Get Up-Sell editions for a book
      operationId: getBookUpSell
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Up-sell options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpSellResponse'
        '404':
          $ref: '#/components/responses/Error404'

  /recommendations/books/{bookId}/cross-sell:
    get:
      tags:
        - Recommendations
      summary: Get Cross-Sell companion titles
      operationId: getBookCrossSell
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Cross-sell companion books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossSellResponse'
        '404':
          $ref: '#/components/responses/Error404'

# ==============================================================================
# REUSABLE COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter RS256-signed JWT access token.

  parameters:
    StoreCodeHeader:
      name: X-Store-Code
      in: header
      description: Multi-store tenant identifier code.
      required: false
      schema:
        type: string
        default: BK_MAIN_ONLINE

    GuestSessionHeader:
      name: X-Guest-Session-Token
      in: header
      description: Anonymous guest user cryptographic session token.
      required: false
      schema:
        type: string

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Cryptographic UUIDv4 token guaranteeing idempotent request execution.
      required: true
      schema:
        type: string
        format: uuid

    PageQuery:
      name: page
      in: query
      description: 1-indexed pagination page number.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    SizeQuery:
      name: size
      in: query
      description: Page size item quantity limit.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Error400:
      description: Bad Request / Validation Failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: Unauthorized / Missing or Expired JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: Forbidden / Entitlement or RBAC restriction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error404:
      description: Resource Not Found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: Concurrency / Idempotency / Business state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error422:
      description: Unprocessable Entity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error429:
      description: Too Many Requests / Rate Limit Exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # --- Envelopes & Primitives ---
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, timestamp, requestId]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
              example: Request payload validation check failed.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
              format: uuid

    PaginationMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8
        hasNext:
          type: boolean
          example: true
        hasPrevious:
          type: boolean
          example: false

    MoneyDto:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Price represented in the lowest denominational unit (e.g. cents, paise).
          example: 3499
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD

    GenericMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Action completed successfully.

    # --- Auth & User Models ---
    GuestSessionResponse:
      type: object
      required: [guestSessionToken, expiresAt]
      properties:
        guestSessionToken:
          type: string
          example: gst_e7b92f8012d449fa894c25f77890a1bc
        expiresAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: customer@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: SecurePassword123!
        firstName:
          type: string
          maxLength: 100
          example: John
        lastName:
          type: string
          maxLength: 100
          example: Doe
        phoneNumber:
          type: string
          example: "+14155552671"
        guestSessionToken:
          type: string
          example: gst_e7b92f8012d449fa894c25f77890a1bc

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          example: SecurePassword123!
        guestSessionToken:
          type: string

    AuthTokenResponse:
      type: object
      required: [userId, email, roles, accessToken, refreshToken, expiresInSeconds]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
          example: ["ROLE_CUSTOMER"]
        entitlements:
          type: array
          items:
            type: string
          example: ["VIP_CLUB"]
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          example: 900

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenRotationResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer

    UserProfileResponse:
      type: object
      required: [userId, email, firstName, lastName, roles, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        roles:
          type: array
          items:
            type: string
        entitlements:
          type: array
          items:
            type: string
        walletBalance:
          $ref: '#/components/schemas/MoneyDto'
        createdAt:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      required: [version]
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
        version:
          type: integer
          description: Optimistic locking version token.

    AddressDto:
      type: object
      required: [addressId, addressType, recipientName, phoneNumber, streetLine1, city, stateProvince, postalCode, countryCode, isDefault]
      properties:
        addressId:
          type: string
          format: uuid
        addressType:
          type: string
          enum: [SHIPPING, BILLING, BOTH]
        recipientName:
          type: string
        phoneNumber:
          type: string
        streetLine1:
          type: string
        streetLine2:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          maxLength: 2
        isDefault:
          type: boolean

    CreateAddressRequest:
      type: object
      required: [addressType, recipientName, phoneNumber, streetLine1, city, stateProvince, postalCode, countryCode]
      properties:
        addressType:
          type: string
          enum: [SHIPPING, BILLING, BOTH]
        recipientName:
          type: string
        phoneNumber:
          type: string
        streetLine1:
          type: string
        streetLine2:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          maxLength: 2
        isDefault:
          type: boolean
          default: false

    # --- Catalog Models ---
    CategoryNodeDto:
      type: object
      required: [categoryId, categoryName, categorySlug, treeLevel]
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categorySlug:
          type: string
        treeLevel:
          type: integer
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNodeDto'

    AuthorDto:
      type: object
      required: [authorId, fullName, authorSlug]
      properties:
        authorId:
          type: string
          format: uuid
        fullName:
          type: string
        authorSlug:
          type: string
        avatarUrl:
          type: string
        bookCount:
          type: integer

    AuthorListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorDto'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    AuthorDetailResponse:
      type: object
      required: [authorId, fullName, authorSlug, bibliography]
      properties:
        authorId:
          type: string
          format: uuid
        fullName:
          type: string
        authorSlug:
          type: string
        biography:
          type: string
        avatarUrl:
          type: string
        bibliography:
          type: array
          items:
            type: object
            properties:
              bookId:
                type: string
                format: uuid
              title:
                type: string
              isbn13:
                type: string
              primaryFormat:
                type: string
              basePrice:
                $ref: '#/components/schemas/MoneyDto'

    PublisherDto:
      type: object
      required: [publisherId, publisherName, publisherCode]
      properties:
        publisherId:
          type: string
          format: uuid
        publisherName:
          type: string
        publisherCode:
          type: string
        websiteUrl:
          type: string

    PublisherListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublisherDto'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    BookFormatSummaryDto:
      type: object
      required: [formatId, formatType, sku, price, inStock]
      properties:
        formatId:
          type: string
          format: uuid
        formatType:
          type: string
          enum: [PAPERBACK, HARDCOVER, EBOOK, AUDIOBOOK]
        sku:
          type: string
        price:
          $ref: '#/components/schemas/MoneyDto'
        inStock:
          type: boolean

    BookCatalogCardDto:
      type: object
      required: [bookId, isbn13, title, primaryCategory, coverImageUrl, averageRating, reviewCount, availableFormats]
      properties:
        bookId:
          type: string
          format: uuid
        isbn13:
          type: string
        title:
          type: string
        subtitle:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              authorId:
                type: string
                format: uuid
              name:
                type: string
              role:
                type: string
        primaryCategory:
          type: object
          properties:
            categoryId:
              type: string
              format: uuid
            name:
              type: string
        coverImageUrl:
          type: string
        averageRating:
          type: number
          format: float
        reviewCount:
          type: integer
        availableFormats:
          type: array
          items:
            $ref: '#/components/schemas/BookFormatSummaryDto'

    BookCatalogListingResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookCatalogCardDto'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    BookDetailResponse:
      type: object
      required: [bookId, isbn13, title, publisher, authors, synopsis, publicationDate, ratingSummary, formats]
      properties:
        bookId:
          type: string
          format: uuid
        isbn13:
          type: string
        isbn10:
          type: string
        title:
          type: string
        subtitle:
          type: string
        publisher:
          type: object
          properties:
            publisherId:
              type: string
              format: uuid
            name:
              type: string
        authors:
          type: array
          items:
            type: object
            properties:
              authorId:
                type: string
                format: uuid
              name:
                type: string
              role:
                type: string
        synopsis:
          type: string
        publicationDate:
          type: string
          format: date
        edition:
          type: string
        pageCount:
          type: integer
        language:
          type: string
        coverImageUrl:
          type: string
        ratingSummary:
          type: object
          properties:
            averageRating:
              type: number
              format: float
            totalReviews:
              type: integer
        formats:
          type: array
          items:
            type: object
            properties:
              formatId:
                type: string
                format: uuid
              formatType:
                type: string
              sku:
                type: string
              price:
                $ref: '#/components/schemas/MoneyDto'
              stockQuantity:
                type: integer
              weightGrams:
                type: integer
        merchandising:
          type: object
          properties:
            upSellItem:
              type: object
            crossSellItems:
              type: array
              items:
                type: object

    # --- Search Models ---
    SearchResultResponse:
      type: object
      required: [query, totalMatches, facets, results]
      properties:
        query:
          type: string
        totalMatches:
          type: integer
        facets:
          type: object
        results:
          type: array
          items:
            type: object
            properties:
              bookId:
                type: string
                format: uuid
              title:
                type: string
              authorNames:
                type: array
                items:
                  type: string
              matchHighlight:
                type: string
              startingPrice:
                $ref: '#/components/schemas/MoneyDto'
              averageRating:
                type: number

    SearchSuggestionDto:
      type: object
      required: [type, id, text]
      properties:
        type:
          type: string
          enum: [BOOK, AUTHOR, CATEGORY]
        id:
          type: string
        text:
          type: string

    # --- Wishlist Models ---
    WishlistItemDto:
      type: object
      required: [bookId, title, authorName, currentPrice, addedAt]
      properties:
        wishlistItemId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        title:
          type: string
        authorName:
          type: string
        coverImageUrl:
          type: string
        currentPrice:
          $ref: '#/components/schemas/MoneyDto'
        desiredPriceAlert:
          type: integer
        addedAt:
          type: string
          format: date-time

    WishlistResponse:
      type: object
      required: [wishlistId, name, totalItems, items]
      properties:
        wishlistId:
          type: string
          format: uuid
        name:
          type: string
        totalItems:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItemDto'

    AddWishlistItemRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: string
          format: uuid
        desiredPriceAlert:
          type: integer
          minimum: 1

    # --- Cart Models ---
    CartLineItemDto:
      type: object
      required: [formatId, bookId, title, formatType, sku, unitPrice, quantity, lineTotal]
      properties:
        formatId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        title:
          type: string
        formatType:
          type: string
        sku:
          type: string
        unitPrice:
          type: integer
        quantity:
          type: integer
        lineTotal:
          type: integer

    CartResponse:
      type: object
      required: [cartId, currency, subtotalAmount, discountAmount, totalPayableAmount, itemCount, items]
      properties:
        cartId:
          type: string
          format: uuid
        currency:
          type: string
        appliedCouponCode:
          type: string
        subtotalAmount:
          type: integer
        discountAmount:
          type: integer
        estimatedTaxAmount:
          type: integer
        totalPayableAmount:
          type: integer
        itemCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLineItemDto'

    AddCartItemRequest:
      type: object
      required: [formatId, quantity]
      properties:
        formatId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    UpdateCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 10

    CartMutationResponse:
      type: object
      required: [cartId, itemCount, subtotalAmount]
      properties:
        cartId:
          type: string
          format: uuid
        itemCount:
          type: integer
        subtotalAmount:
          type: integer
        message:
          type: string

    MergeCartRequest:
      type: object
      required: [guestSessionToken]
      properties:
        guestSessionToken:
          type: string

    ApplyCouponRequest:
      type: object
      required: [couponCode]
      properties:
        couponCode:
          type: string
          minLength: 4
          maxLength: 32

    # --- Orders Models ---
    CheckoutOrderRequest:
      type: object
      required: [cartId, shippingAddressId, billingAddressId, shippingCarrierCode, shippingServiceLevel, paymentIntent]
      properties:
        cartId:
          type: string
          format: uuid
        shippingAddressId:
          type: string
          format: uuid
        billingAddressId:
          type: string
          format: uuid
        shippingCarrierCode:
          type: string
          example: FEDEX
        shippingServiceLevel:
          type: string
          example: STANDARD
        paymentIntent:
          type: object
          required: [tenderSplits]
          properties:
            tenderSplits:
              type: array
              items:
                type: object
                required: [tenderType, amount]
                properties:
                  tenderType:
                    type: string
                    enum: [DIGITAL_WALLET, CREDIT_CARD, DEBIT_CARD, UPI, GIFT_CARD]
                  amount:
                    type: integer
                  gatewayPaymentMethodToken:
                    type: string

    OrderConfirmationResponse:
      type: object
      required: [orderNumber, orderStatus, totalAmount, currency, placedAt, paymentStatus, lineItems]
      properties:
        orderNumber:
          type: string
        orderStatus:
          type: string
        totalAmount:
          type: integer
        currency:
          type: string
        placedAt:
          type: string
          format: date-time
        estimatedDeliveryWindow:
          type: object
          properties:
            minDate:
              type: string
              format: date-time
            maxDate:
              type: string
              format: date-time
        paymentStatus:
          type: string
        lineItems:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              title:
                type: string
              quantity:
                type: integer
              lineTotal:
                type: integer

    OrderSummaryDto:
      type: object
      required: [orderNumber, orderStatus, totalAmount, currency, totalItems, placedAt]
      properties:
        orderNumber:
          type: string
        orderStatus:
          type: string
        totalAmount:
          type: integer
        currency:
          type: string
        totalItems:
          type: integer
        placedAt:
          type: string
          format: date-time
        trackingNumber:
          type: string
        carrier:
          type: string
        isReturnEligible:
          type: boolean

    OrderHistoryResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummaryDto'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    OrderDetailResponse:
      type: object
      required: [orderNumber, orderStatus, pricing, shippingDetails, lineItems]
      properties:
        orderNumber:
          type: string
        orderStatus:
          type: string
        pricing:
          type: object
          properties:
            subtotalAmount:
              type: integer
            discountAmount:
              type: integer
            shippingAmount:
              type: integer
            taxAmount:
              type: integer
            totalAmount:
              type: integer
            currency:
              type: string
        shippingDetails:
          type: object
        lineItems:
          type: array
          items:
            type: object

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 255

    OrderCancellationResponse:
      type: object
      required: [orderNumber, orderStatus, refundStatus, refundAmount, cancelledAt]
      properties:
        orderNumber:
          type: string
        orderStatus:
          type: string
        refundStatus:
          type: string
        refundAmount:
          type: integer
        cancelledAt:
          type: string
          format: date-time

    CreateReturnRequest:
      type: object
      required: [reasonCode, returnItems]
      properties:
        reasonCode:
          type: string
          enum: [DAMAGED_ITEM, WRONG_ITEM, CHANGED_MIND, POOR_QUALITY]
        customerRemarks:
          type: string
        returnItems:
          type: array
          items:
            type: object
            required: [orderLineItemId, quantity]
            properties:
              orderLineItemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1

    ReturnAuthorizationResponse:
      type: object
      required: [rmaNumber, rmaStatus, returnCarrier, returnTrackingNumber, prepaidReturnLabelUrl, estimatedRefundAmount]
      properties:
        rmaNumber:
          type: string
        rmaStatus:
          type: string
        returnCarrier:
          type: string
        returnTrackingNumber:
          type: string
        prepaidReturnLabelUrl:
          type: string
          format: uri
        estimatedRefundAmount:
          type: integer
        returnInstructions:
          type: string

    # --- Payments Models ---
    CreatePaymentIntentRequest:
      type: object
      required: [orderNumber]
      properties:
        orderNumber:
          type: string
        useWalletBalance:
          type: boolean
          default: false
        giftCardCode:
          type: string

    PaymentIntentResponse:
      type: object
      required: [paymentTransactionId, totalOrderAmount, remainingPayableViaGateway, currency]
      properties:
        paymentTransactionId:
          type: string
          format: uuid
        totalOrderAmount:
          type: integer
        walletDeduction:
          type: integer
        giftCardDeduction:
          type: integer
        remainingPayableViaGateway:
          type: integer
        gatewayClientSecret:
          type: string
        gatewayProvider:
          type: string
        currency:
          type: string

    CustomerWalletResponse:
      type: object
      required: [walletId, currentBalance, heldBalance, currency, recentLedger]
      properties:
        walletId:
          type: string
          format: uuid
        currentBalance:
          type: integer
        heldBalance:
          type: integer
        currency:
          type: string
        recentLedger:
          type: array
          items:
            type: object
            properties:
              entryId:
                type: string
                format: uuid
              entryType:
                type: string
              amount:
                type: integer
              balanceAfter:
                type: integer
              createdAt:
                type: string
                format: date-time

    # --- Shipping Models ---
    ShippingRateCalculationRequest:
      type: object
      required: [destinationPostalCode, countryCode, cartId]
      properties:
        destinationPostalCode:
          type: string
        countryCode:
          type: string
          maxLength: 2
        cartId:
          type: string
          format: uuid

    ShippingRateOptionDto:
      type: object
      required: [carrierCode, serviceLevel, rateAmount, currency, isFreeShippingApplied, estimatedDeliveryMin, estimatedDeliveryMax, transitDays]
      properties:
        carrierCode:
          type: string
        serviceLevel:
          type: string
        rateAmount:
          type: integer
        currency:
          type: string
        isFreeShippingApplied:
          type: boolean
        estimatedDeliveryMin:
          type: string
          format: date-time
        estimatedDeliveryMax:
          type: string
          format: date-time
        transitDays:
          type: string

    ConsignmentTrackingResponse:
      type: object
      required: [trackingNumber, carrierCode, serviceLevel, consignmentStatus, milestones]
      properties:
        trackingNumber:
          type: string
        carrierCode:
          type: string
        serviceLevel:
          type: string
        consignmentStatus:
          type: string
        estimatedDelivery:
          type: string
          format: date-time
        milestones:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              location:
                type: string
              timestamp:
                type: string
                format: date-time
              remarks:
                type: string

    # --- Reviews Models ---
    ReviewDto:
      type: object
      required: [reviewId, authorName, rating, isVerifiedPurchase, helpfulVotes, createdAt]
      properties:
        reviewId:
          type: string
          format: uuid
        authorName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewTitle:
          type: string
        reviewBody:
          type: string
        isVerifiedPurchase:
          type: boolean
        helpfulVotes:
          type: integer
        createdAt:
          type: string
          format: date-time

    BookReviewsResponse:
      type: object
      required: [bookId, averageRating, totalReviews, reviews]
      properties:
        bookId:
          type: string
          format: uuid
        averageRating:
          type: number
          format: float
        totalReviews:
          type: integer
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDto'

    SubmitReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewTitle:
          type: string
          maxLength: 200
        reviewBody:
          type: string

    VoteReviewRequest:
      type: object
      required: [isHelpful]
      properties:
