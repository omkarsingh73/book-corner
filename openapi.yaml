openapi: 3.1.0
info:
  title: Book Corner REST API
  description: |
    Production-grade OpenAPI 3.1.0 specification for the **Book Corner** online bookstore platform.
    Reverse-engineered from architectural wireframes, DDD domain models, and normalized PostgreSQL schemas.
  version: 1.0.0
  contact:
    name: Book Corner Architecture Team
    email: api-support@bookcorner.com
    url: https://bookcorner.com/developer
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://api.bookcorner.com/api/v1
    description: Production API Gateway
  - url: https://api.staging.bookcorner.com/api/v1
    description: Staging / Sandbox Environment

tags:
  - name: Authentication
    description: Guest session management, credential authentication, JWT token issuance and rotation.
  - name: Users
    description: Customer profiles, address book management, and account preferences.
  - name: Catalog
    description: Product master books, format SKUs, publishers, authors, and hierarchical categories.
  - name: Search
    description: Typo-tolerant full-text search with faceted navigation and auto-complete suggestions.
  - name: Wishlist
    description: Customer book wishlists and price alert subscriptions.
  - name: Cart
    description: Shopping basket lifecycle, guest cart carryover, item quantity mutations, and discounts.
  - name: Orders
    description: Checkout orchestration saga, customer order history, self-service cancellations, and RMAs.
  - name: Payments
    description: Payment gateway integration, multi-tender split calculation, digital wallet ledger, and webhooks.
  - name: Shipping
    description: Real-time dynamic freight calculation, delivery ETA estimation, and consignment tracking.
  - name: Reviews
    description: Customer ratings (1-5 stars), verified purchase written reviews, and helpfulness voting.
  - name: Recommendations
    description: Personalized carousels, automated Up-Sell collector editions, and Cross-Sell companion titles.

paths:
  # ============================================================================
  # AUTHENTICATION APIS
  # ============================================================================
  /auth/guest-session:
    post:
      tags:
        - Authentication
      summary: Initialize an anonymous guest session
      operationId: startGuestSession
      description: Issues a cryptographically signed guest session token to track temporary baskets and preferences.
      parameters:
        - $ref: '#/components/parameters/StoreCodeHeader'
      responses:
        '201':
          description: Guest session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer account
      operationId: registerCustomer
      description: Creates a new user profile, optionally merges an existing guest session, and returns JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user credentials
      operationId: loginUser
      description: Validates email and password, issuing access and refresh JWTs upon successful authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate refresh token
      operationId: refreshToken
      description: Exchanges an unexpired refresh token for a newly rotated access and refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRotationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Invalidate user session
      operationId: logoutUser
      security:
        - BearerAuth: []
      description: Revokes the supplied refresh token and blacklists the current JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          $ref: '#/components/responses/Error401'

  # ============================================================================
  # USERS APIS
  # ============================================================================
  /users/me:
    get:
      tags:
        - Users
      summary: Retrieve current authenticated user profile
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    patch:
      tags:
        - Users
      summary: Update user profile
      operationId: updateUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'

  /users/me/addresses:
    get:
      tags:
        - Users
      summary: List user saved addresses
      operationId: listUserAddresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Saved addresses retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressDto'
        '401':
          $ref: '#/components/responses/Error401'
    post:
      tags:
        - Users
      summary: Add an address to address book
      operationId: createUserAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDto'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /users/me/addresses/{addressId}:
    delete:
      tags:
        - Users
      summary: Delete address from address book
      operationId: deleteUserAddress
      security:
        - BearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Address deleted successfully.
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # CATALOG APIS
  # ============================================================================
  /categories:
    get:
      tags:
        - Catalog
      summary: Retrieve complete hierarchical category tree
      operationId: listCategories
      responses:
        '200':
          description: Hierarchical category tree retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNodeDto'
        '500':
          $ref: '#/components/responses/Error500'

  /authors:
    get:
      tags:
        - Catalog
      summary: List authors with pagination and search
      operationId: listAuthors
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: query
          in: query
          description: Author name search filter
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated author list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
        '400':
          $ref: '#/components/responses/Error400'

  /authors/{authorId}:
    get:
      tags:
        - Catalog
      summary: Retrieve author profile and bibliography
      operationId: getAuthorById
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Author profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDetailResponse'
        '404':
          $ref: '#/components/responses/Error404'

  /publishers:
    get:
      tags:
        - Catalog
      summary: List book publishers
      operationId: listPublishers
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Publisher directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherListResponse'

  /books:
    get:
      tags:
        - Catalog
      summary: Browse and filter books catalog
      operationId: browseBooks
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreCodeHeader'
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: authorSlug
          in: query
          required: false
          schema:
            type: string
        - name: formatType
          in: query
          required: false
          schema:
            type: string
            enum: [PAPERBACK, HARDCOVER, EBOOK, AUDIOBOOK]
        - name: minPrice
          in: query
          description: Minimum price in smallest currency unit (cents)
          required: false
          schema:
            type: integer
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum price in smallest currency unit (cents)
          required: false
          schema:
            type: integer
            minimum: 0
        - name: minRating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [POPULARITY, PRICE_ASC, PRICE_DESC, NEWEST, RATING]
            default: POPULARITY
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Filtered book listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCatalogListingResponse'
        '400':
          $ref: '#/components/responses/Error400'

  /books/{bookId}:
    get:
      tags:
        - Catalog
      summary: Get comprehensive book details
      operationId: getBookDetails
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreCodeHeader'
      responses:
        '200':
          description: Detailed book specifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # SEARCH APIS
  # ============================================================================
  /search:
    get:
      tags:
        - Search
      summary: Multi-faceted full-text search
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          description: Full-text search keyword query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [PAPERBACK, HARDCOVER, EBOOK, AUDIOBOOK]
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Faceted search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultResponse'
        '400':
          $ref: '#/components/responses/Error400'

  /search/suggestions:
    get:
      tags:
        - Search
      summary: Auto-complete typeahead suggestions
      operationId: getSearchSuggestions
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
            maximum: 20
      responses:
        '200':
          description: Search suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchSuggestionDto'
        '400':
          $ref: '#/components/responses/Error400'

  # ============================================================================
  # WISHLIST APIS
  # ============================================================================
  /wishlists:
    get:
      tags:
        - Wishlist
      summary: Retrieve authenticated customer wishlist
      operationId: getWishlist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Customer wishlist retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /wishlists/items:
    post:
      tags:
        - Wishlist
      summary: Add book to wishlist
      operationId: addWishlistItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWishlistItemRequest'
      responses:
        '201':
          description: Item added to wishlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItemDto'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /wishlists/items/{bookId}:
    delete:
      tags:
        - Wishlist
      summary: Remove book from wishlist
      operationId: removeWishlistItem
      security:
        - BearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item removed from wishlist.
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # CART APIS
  # ============================================================================
  /cart:
    get:
      tags:
        - Cart
      summary: Retrieve active shopping cart
      operationId: getActiveCart
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestSessionHeader'
        - $ref: '#/components/parameters/StoreCodeHeader'
      responses:
        '200':
          description: Active cart details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'

  /cart/items:
    post:
      tags:
        - Cart
      summary: Add format SKU item to cart
      operationId: addItemToCart
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Item added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'

  /cart/items/{formatId}:
    patch:
      tags:
        - Cart
      summary: Mutate cart item quantity
      operationId: updateCartItemQuantity
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: formatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/GuestSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemQuantityRequest'
      responses:
        '200':
          description: Cart updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
    delete:
      tags:
        - Cart
      summary: Remove item from cart
      operationId: removeCartItem
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: formatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/GuestSessionHeader'
      responses:
        '204':
          description: Item deleted.
        '404':
          $ref: '#/components/responses/Error404'

  /cart/merge:
    post:
      tags:
        - Cart
      summary: Synchronize guest cart into authenticated user cart
      operationId: mergeGuestCart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
      responses:
        '200':
          description: Carts merged successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /cart/coupon:
    post:
      tags:
        - Cart
      summary: Apply promotional coupon code to active cart
      operationId: applyCartCoupon
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
      responses:
        '200':
          description: Coupon applied successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
    delete:
      tags:
        - Cart
      summary: Remove coupon from cart
      operationId: removeCartCoupon
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestSessionHeader'
      responses:
        '200':
          description: Coupon removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResponse'

  # ============================================================================
  # ORDERS APIS
  # ============================================================================
  /orders/checkout:
    post:
      tags:
        - Orders
      summary: Submit checkout and place order
      operationId: submitOrderCheckout
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutOrderRequest'
      responses:
        '201':
          description: Order placed and confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          description: Payment declined or authorization failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Error409'

  /orders:
    get:
      tags:
        - Orders
      summary: List customer order history
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, PENDING_PAYMENT, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, RETURNED]
      responses:
        '200':
          description: Order history retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /orders/{orderNumber}:
    get:
      tags:
        - Orders
      summary: Retrieve detailed order specifications and invoice
      operationId: getOrderByNumber
      security:
        - BearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed order record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{orderNumber}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel order within policy grace period
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled and refund initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancellationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'

  /orders/{orderNumber}/returns:
    post:
      tags:
        - Orders
      summary: Initiate Return Merchandise Authorization (RMA)
      operationId: requestOrderReturn
      security:
        - BearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturnRequest'
      responses:
        '201':
          description: Return authorized and label issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnAuthorizationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # ============================================================================
  # PAYMENTS APIS
  # ============================================================================
  /payments/intent:
    post:
      tags:
        - Payments
      summary: Create payment intent with multi-tender split
      operationId: createPaymentIntent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '200':
          description: Payment intent coordinated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /payments/webhooks/{provider}:
    post:
      tags:
        - Payments
      summary: Gateway webhook callback listener
      operationId: ingestPaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, razorpay, adyen]
        - name: Stripe-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/Error400'

  /payments/wallet:
    get:
      tags:
        - Payments
      summary: Retrieve digital wallet balance and ledger history
      operationId: getCustomerWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Customer wallet summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWalletResponse'
        '401':
          $ref: '#/components/responses/Error401'

  # ============================================================================
