AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation Template: AWS Secrets Manager & AWS KMS Customer Managed Keys (CMK)
  for Book Corner Platform. Provisions high-entropy managed credentials for PostgreSQL,
  JWT token signing secrets, and third-party integration keys with automated rotation support.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Environment Configuration"
        Parameters:
          - Environment
          - AppName
      - Label:
          default: "Database Master Credentials Configuration"
        Parameters:
          - DatabaseMasterUsername
          - DatabaseName

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment target environment (dev, staging, prod).

  AppName:
    Type: String
    Default: book-corner
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Application name identifier used in resource naming and scoping.

  DatabaseMasterUsername:
    Type: String
    Default: bookcorner_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]+$'
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters and underscores.
    Description: Master username for Amazon RDS PostgreSQL.

  DatabaseName:
    Type: String
    Default: bookcorner
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]+$'
    Description: Primary database schema name created upon RDS initialization.

Resources:
  # ---------------------------------------------------------------------------
  # 1. AWS KMS Customer Managed Key (CMK)
  # Envelope encryption for Secrets Manager, RDS storage, and ECR artifacts
  # ---------------------------------------------------------------------------
  BookCornerKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS Customer Managed Key for ${AppName} (${Environment}) data and secrets encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: bookcorner-key-policy
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
          - Sid: AllowSecretsManagerOperations
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
          - Sid: AllowRdsOperations
            Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Environment}-kms-key"
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  BookCornerKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AppName}-${Environment}-key"
      TargetKeyId: !Ref BookCornerKmsKey

  # ---------------------------------------------------------------------------
  # 2. Database Credentials Secret (PostgreSQL)
  # High-entropy, auto-generated master password
  # ---------------------------------------------------------------------------
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}/${Environment}/rds"
      Description: Master database credentials and connection attributes for Amazon RDS PostgreSQL.
      KmsKeyId: !Ref BookCornerKmsKey
      GenerateSecretString:
        SecretStringTemplate: !Sub |
          {
            "engine": "postgres",
            "username": "${DatabaseMasterUsername}",
            "dbname": "${DatabaseName}",
            "port": 5432
          }
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"\/@ '
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 3. JWT Signing Secret
  # 256-bit+ cryptographic HMAC key for Spring Security token signing & verification
  # ---------------------------------------------------------------------------
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}/${Environment}/jwt"
      Description: 256-bit cryptographic HMAC secret used by Spring Security for JWT signing.
      KmsKeyId: !Ref BookCornerKmsKey
      GenerateSecretString:
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludeCharacters: '"\/ '
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 4. Third-Party Integrations Secret
  # API keys and webhook secrets for Stripe and Logistics Carriers
  # ---------------------------------------------------------------------------
  IntegrationsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}/${Environment}/integrations"
      Description: Third-party integration credentials for payment gateways and carrier tracking APIs.
      KmsKeyId: !Ref BookCornerKmsKey
      SecretString: '{"stripeApiKey":"REPLACE_WITH_STRIPE_SECRET_KEY","stripeWebhookSecret":"REPLACE_WITH_STRIPE_WEBHOOK","fedexApiKey":"REPLACE_WITH_FEDEX_KEY"}'
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  KmsKeyArn:
    Description: ARN of the KMS Customer Managed Key.
    Value: !GetAtt BookCornerKmsKey.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-KmsKeyArn"

  KmsKeyId:
    Description: ID of the KMS Customer Managed Key.
    Value: !Ref BookCornerKmsKey
    Export:
      Name: !Sub "${AppName}-${Environment}-KmsKeyId"

  KmsKeyAlias:
    Description: Alias name of the KMS Key.
    Value: !Ref BookCornerKmsAlias
    Export:
      Name: !Sub "${AppName}-${Environment}-KmsKeyAlias"

  DatabaseSecretArn:
    Description: ARN of the RDS Database credentials secret.
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub "${AppName}-${Environment}-DatabaseSecretArn"

  JwtSecretArn:
    Description: ARN of the JWT Signing Secret.
    Value: !Ref JwtSecret
    Export:
      Name: !Sub "${AppName}-${Environment}-JwtSecretArn"

  IntegrationsSecretArn:
    Description: ARN of the third-party integrations secret.
    Value: !Ref IntegrationsSecret
    Export:
      Name: !Sub "${AppName}-${Environment}-IntegrationsSecretArn"
